name: 🚀 Otomasi Build & Push Docker Hub

# Robot ini otomatis bangun setiap kali kamu 'git push' ke branch main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari repositori GitHub
      - name: 📥 Ambil Kode Proyek
        uses: actions/checkout@v4

      # 2. Login otomatis ke Docker Hub menggunakan kunci rahasia kamu
      - name: 🔐 Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Siapkan mesin build Docker canggih di cloud GitHub
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Masak (Build) dan Upload (Push) otomatis ke Docker Hub kamu!
      - name: 🏗️ Build & Push Image Otomatis
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            dickyaldianpratama/irwa-fashion-store:2.0.0